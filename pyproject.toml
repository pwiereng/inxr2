[build-system]
requires = ["setuptools>=65.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "inxr2"
version = "0.1.0"
description = "INXR2 - Cross-reference code browser for git repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "INXR2 Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # FastAPI and web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",  # Async PostgreSQL driver
    "psycopg2-binary>=2.9.0",  # Sync PostgreSQL driver (for Alembic)

    # Git operations
    "gitpython>=3.1.40",

    # Tree-sitter for parsing
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-bash>=0.23.0",
    "tree-sitter-swift>=0.0.1",

    # Configuration
    "pyyaml>=6.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-watch>=4.2.0",
    "httpx>=0.25.0",  # Async HTTP client for testing FastAPI

    # Code quality
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "types-PyYAML>=6.0.0",  # Type stubs for PyYAML
    "isort>=5.12.0",

    # Development tools
    "ipython>=8.15.0",
    "ipdb>=0.13.0",
    "pygments>=2.20.0",  # CVE-2026-4539 fixed in 2.20.0

    # Pre-commit hooks
    "pre-commit>=3.4.0",
]

[project.scripts]
inxr2 = "inxr2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inxr2 = ["py.typed", "adapters/external/treesitter/builtins/*.json"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | \.tmp
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["inxr2", "src", "tests"]
skip_glob = [".tmp/*"]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["inxr2", "src", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_python.*", "tree_sitter_typescript.*", "tree_sitter_javascript.*", "tree_sitter_c.*", "tree_sitter_cpp.*", "tree_sitter_java.*", "tree_sitter_c_sharp.*", "tree_sitter_go.*", "tree_sitter_ruby.*", "tree_sitter_bash.*", "gitpython.*"]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "contract: Contract tests verifying fake-vs-real parity",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
# SQLAlchemy's async engine runs DB I/O inside greenlets; without tracking
# the greenlet (and thread) concurrency contexts, coverage silently fails to
# record the async route/adapter code that executes there, under-counting
# branch coverage for everything that touches the database.
concurrency = ["thread", "greenlet"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "src/inxr2/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
