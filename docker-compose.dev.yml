
services:
  # Development container (backend + frontend + embedded PostgreSQL)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ${COMPOSE_CONTAINER_PREFIX:-inxr2}-dev
    working_dir: /workspace
    env_file:
      - .env.dev
    volumes:
      # Mount entire project for development
      - .:/workspace
      # Mount repos directory (configurable via INXR2_REPOS_DIR env var)
      - ${INXR2_REPOS_DIR:-..}:/repos:ro
      # Use named volume for frontend node_modules (Linux binaries)
      - node_modules:/workspace/frontend/node_modules
      # PostgreSQL data persistence
      - pgdata:/home/devuser/pgdata
    ports:
      - "${APP_PORT:-8000}:8000"        # FastAPI backend
      - "${FRONTEND_PORT:-5173}:5173"   # Vite frontend dev server
      - "${MCP_PORT:-3000}:3000"        # MCP server (SSE)
    stdin_open: true
    tty: true
    command: /bin/bash

  # Playwright browser server for interactive testing
  playwright:
    build:
      context: ./qa-agent
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CONTAINER_PREFIX:-inxr2}-playwright
    ports:
      - "${PLAYWRIGHT_PORT:-9222}:9222"
    profiles:
      - qa  # Only start with --profile qa

volumes:
  pgdata:
    driver: local
  node_modules:
    driver: local
