
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: inxr2-postgres-dev
    env_file:
      - .env.dev
    # Note: env_file loads all variables, no need to redeclare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inxr2-network

  # Development container (backend + frontend)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: inxr2-dev
    working_dir: /workspace
    env_file:
      - .env.dev
    volumes:
      # Mount entire project for development
      - .:/workspace
      # Use named volume for frontend node_modules (Linux binaries)
      - node_modules:/workspace/frontend/node_modules
      # Cache pip packages
      - pip_cache:/home/devuser/.cache/pip
    ports:
      - "8000:8000"  # FastAPI backend
      - "5173:5173"  # Vite frontend dev server
    # Note: env_file loads all variables defined in .env.dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inxr2-network
    stdin_open: true
    tty: true
    command: /bin/bash

networks:
  inxr2-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pip_cache:
    driver: local
  node_modules:
    driver: local
