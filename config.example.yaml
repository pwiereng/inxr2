# INXR2 Configuration Example
#
# This file configures repositories to index and browse.
# Copy this to config.yaml and customize for your setup.
#
# Environment variables can be used with ${VAR} or ${VAR:-default} syntax.
#
# Mount Points (inside Docker container):
#   /workspace  - The inxr2 project itself (dev mode)
#   /repos      - External repositories (mounted via INXR2_REPOS_DIR)
#
# Usage:
#   ./scripts/run-inxr2.sh ~/my-repos --config config.yaml

repositories:
  # Repositories from mounted /repos directory
  # Set INXR2_REPOS_DIR to point to your repos directory on the host
  - name: "my-project"
    path: "/repos/my-project"             # /repos is mounted from INXR2_REPOS_DIR
    branches:
      - main
    days: 90                              # Per-repo indexing depth (overrides CLI --days if larger)
    exclude_paths:                        # Directory names to skip (matched against any path segment)
      - "vendor"
      - "node_modules"
      - "dist"
      - "build"
    exclude_patterns:
      - "**/node_modules/**"
      - "**/__pycache__/**"
      - "**/venv/**"
      - "**/.git/**"

  # The inxr2 project itself (available in dev mode)
  # - name: "inxr2"
  #   path: "/workspace"
  #   branches:
  #     - main

  # Remote repository (Phase 1.9 - not yet implemented)
  # - name: "react"
  #   url: "https://github.com/facebook/react"
  #   branches:
  #     - main

indexing:
  batch_size: 100                         # Files per database batch

server:
  host: "0.0.0.0"
  port: 8000
