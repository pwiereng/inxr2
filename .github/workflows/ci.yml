name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Lint, formatting, and type checking
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install ".[dev]"

      - name: black
        run: black --check .

      - name: isort
        run: isort --check .

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src/ tests/

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: prettier
        run: npm run format:check
        working-directory: frontend

      - name: eslint
        run: npm run lint
        working-directory: frontend

      - name: tsc
        run: npm run type-check
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Secret scanning (every PR and push to main)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency vulnerability scanning (main only — repo-wide, not per-change)
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency Vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
