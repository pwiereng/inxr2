# Dependabot version updates — weekly.
#
# Strategy:
#   - Minor/patch updates are batched into one group per ecosystem (low risk,
#     fast to review/merge once CI is green).
#   - MAJOR updates are deliberately NOT grouped, so each arrives as its own PR
#     to be evaluated individually (majors often carry breaking changes — e.g. a
#     new eslint/react-hooks major adds lint rules existing code violates).
#   - Docker base-image MAJOR bumps are ignored entirely: runtime upgrades
#     (Python, Node) are deliberate, separately-tested efforts, not routine
#     dependency hygiene. Our CI lint/type-check runs on the GitHub runner
#     toolchain and does NOT rebuild these images, so it cannot validate them.
#
# Security updates are enabled separately in repo settings and are not throttled
# by this file.
#
# ⚠️ TEMPORARILY DISABLED (2026-06-14): version-update PRs are turned OFF for
# every ecosystem via `open-pull-requests-limit: 0`. The config is kept intact
# so it can be re-enabled by restoring the limits (e.g. back to 5) once the
# project is ready to take routine dependency PRs again. NOTE: this only
# disables *version* updates — *security* updates come from repo settings and
# are unaffected; disable those under Settings → Code security if also unwanted.
version: 2
updates:
  # ----- Python (pip) -----
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pip
    directory: "/mcp-server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pip
    directory: "/qa-agent"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ----- Frontend (npm) -----
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ----- GitHub Actions -----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"

  # ----- Docker -----
  # Minor/patch base-image bumps only; major (runtime) bumps are ignored and
  # handled deliberately. See strategy note above.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: docker
    directory: "/mcp-server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: docker
    directory: "/qa-agent"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
