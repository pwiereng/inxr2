
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: inxr2-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    # Note: env_file loads all variables, no need to redeclare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inxr2-network

  # INXR2 Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inxr2-app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    # Note: env_file loads all variables defined in .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inxr2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  inxr2-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
