[project]
name = "inxr2-mcp-server"
version = "0.1.0"
description = "MCP server exposing INXR2 code intelligence as tools for AI assistants"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
